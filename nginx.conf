server {
    listen 8080;
    server_name _;
    
    root /var/www/html;
    index index.php;

    # Soporte para Clean URLs de Drupal 7
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Procesar archivos PHP vía PHP-FPM (TCP en localhost puerto 9000)
    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # Bloquear acceso a archivos sensibles de Drupal
    location ~ \.(engine|inc|info|install|make|module|profile|test|po|sh|sql|theme|tpl(\.php)?|xtmpl)$ {
        deny all;
    }

    location ~ ^/sites/.*/files/php/ {
        deny all;
    }

    # Cache de recursos estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires max;
        log_not_found off;
    }
}

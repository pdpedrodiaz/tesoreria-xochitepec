server {
    listen 8080;
    server_name _;
    
    root /var/www/html;
    index index.php;

    # Clean URLs para Drupal 7
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Procesar PHP
    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
    # Permitir archivos de hasta 500 MB (para el archivo files de 223 MB)
    client_max_body_size 500M;
    # Bloqueos de seguridad para Drupal
    location ~ \.(engine|inc|info|install|make|module|profile|test|po|sh|sql|theme|tpl(\.php)?|xtmpl)$ {
        deny all;
    }

    location ~ ^/sites/.*/files/php/ {
        deny all;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires max;
        log_not_found off;
    }
}